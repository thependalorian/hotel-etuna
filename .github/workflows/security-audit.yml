name: Security Audit

on:
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Prompt Pack pre-flight (§15)
        run: npm run security:preflight
        continue-on-error: true

      - name: Capture npm audit evidence (Gap 12)
        run: npm run security:audit-report
        continue-on-error: true

      - name: Run npm audit (fail on critical only)
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-results
          path: |
            compliance/evidence/security/npm-audit-*.json
            audit-results.json
          retention-days: 30
