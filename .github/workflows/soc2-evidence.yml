# Required GitHub secrets (hotel-etuna repo):
#   DATABASE_URL — Neon pooled connection for collect-evidence + RLS checks
#   DATABASE_URL_UNPOOLED — direct Neon host for verify-pgaudit.ts (extension queries)
#   HUB_TENANT_ID — hub tenant UUID for SOC2 agent scope
name: SOC 2 Evidence Collection

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  soc2-audit:
    name: Run SOC 2 audit agents
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
        working-directory: hotel-etuna

      - name: Policy runtime anchor checks
        working-directory: hotel-etuna
        run: npx tsx scripts/compliance/validate-policy-implementation.ts --json
        continue-on-error: true

      - name: Verify pgAudit (Neon)
        working-directory: hotel-etuna
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npx tsx scripts/compliance/verify-pgaudit.ts --json
        continue-on-error: true

      - name: Collect SOC 2 evidence
        working-directory: hotel-etuna
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          HUB_TENANT_ID: ${{ secrets.HUB_TENANT_ID }}
        run: npx tsx scripts/soc2/collect-evidence.ts

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soc2-evidence
          path: |
            hotel-etuna/compliance/evidence/soc2/*.json
            hotel-etuna/compliance/evidence/2026-*/pgaudit-status.json
          retention-days: 90
